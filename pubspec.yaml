name: rever
description: Your Personal Learning OS — AI-powered learning for adults and kids.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^17.3.0

  # Networking
  dio: ^5.11.0
  supabase_flutter: ^2.16.0

  # Local storage
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4

  # UI
  flutter_svg: ^2.0.17
  lottie: ^3.5.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  google_fonts: ^8.2.1

  # Animations
  rive: ^0.14.10

  # Auth
  google_sign_in: ^6.3.0
  shared_preferences: ^2.5.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.5.0
  json_annotation: ^4.9.0

  # Firebase
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.4.3
  http: ^1.6.0
  html: ^0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^4.0.4
  json_serializable: ^6.9.4
  drift_dev: ^2.34.0
  mockito: ^5.4.6
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/
